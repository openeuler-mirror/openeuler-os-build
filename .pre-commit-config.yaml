# 修复模式：仅对暂存区文件生效；存量仓库请勿运行 pre-commit run --all-files
minimum_pre_commit_version: "4.0"

repos:
  # ===== 通用基础 hook（所有语言） =====
  - repo: https://gitcode.com/gh_mirrors/pr/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace          # 修复：移除行尾空白
        exclude: ^(pnpm-lock\.yaml|package-lock\.json|.*\.lock)$
      - id: end-of-file-fixer            # 修复：确保文件以单个换行结尾
        exclude: ^(pnpm-lock\.yaml|package-lock\.json|.*\.lock)$
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 存量最大文件约 816KB（script/tools/packages_duty.yaml），按此调整上限
        args: [--maxkb=1024]
      - id: detect-private-key

  # ===== 密钥检测 =====
  - repo: https://gitcode.com/gh_mirrors/gi/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ===== 拼写检查 =====
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^(vendor/|third_party/|generated/)

  # ===== Python：Ruff（修复）+ Bandit（检查） =====
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]                    # 修复模式；只读档去掉 --fix
      - id: ruff-format                  # 修复模式；只读档加 --check
  - repo: https://gitcode.com/gh_mirrors/ba/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-lll]                     # 存量仓库先只看高危；清理后按路线图放开 -ll → 全量

  # ===== Shell：Shfmt（修复）+ ShellCheck（检查） =====
  - repo: https://gh-proxy.com/https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt                        # 修复模式（manifest 已内置 --write）
  - repo: https://gh-proxy.com/https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]         # 存量默认 error 起步；清理后按路线图收紧回 warning

  # ===== Markdown：markdownlint（修复） =====
  - repo: https://gitcode.com/gh_mirrors/ma/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--fix]                    # 修复模式；只读档去掉 --fix
